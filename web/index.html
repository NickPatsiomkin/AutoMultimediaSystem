<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homelab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 4rem;
            opacity: 0.9;
        }

        .grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 180px;
            height: 180px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            background: #000;
            gap: 15px;
        }

        .card:hover {
            border-color: #666;
            background: #111;
            transform: translateY(-5px);
        }

        .admin-btn {
            padding: 10px 24px;
            border: 1px solid #333;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            border-color: #666;
            background: #111;
        }

        .credit {
            font-size: 0.85rem;
            opacity: 0.5;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .footer {
            margin-top: 6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .status-section {
            width: 100%;
            max-width: 840px;
            margin-top: 3.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .status-title {
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.75;
        }

        .status-frame {
            width: 100%;
            border: 1px solid #333;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
        }

        .status-frame iframe {
            width: 100%;
            height: 420px;
            border: 0;
            display: block;
            background: #000;
        }

        @media (max-width: 800px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 3rem;
            }

            .grid {
                gap: 20px;
            }

            .card {
                width: 150px;
                height: 150px;
                font-size: 0.85rem;
            }

            .icon {
                width: 50px;
                height: 50px;
            }

            .footer {
                margin-top: 3rem;
            }

            .status-frame iframe {
                height: 520px;
            }
        }
    </style>
</head>
<body>
    <h1>Homelab</h1>
    
    <div class="grid">
        <a href="https://files.patsiomkinhomelab.com" class="card">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                </svg>
            </div>
            <span>File Storage</span>
        </a>

        <a href="https://torrent.patsiomkinhomelab.com" class="card">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
            </div>
            <span>qBittorrent</span>
        </a>

        <a href="https://media.patsiomkinhomelab.com" class="card">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="2" y="7" width="20" height="15" rx="2" ry="2"/>
                    <polyline points="17 2 12 7 7 2"/>
                </svg>
            </div>
            <span>Jellyfin</span>
        </a>

        <a href="https://music.patsiomkinhomelab.com" class="card">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/>
                    <polygon points="10 8 16 12 10 16 10 8"/>
                </svg>
            </div>
            <span>Navidrome</span>
        </a>
    </div>

    <div class="footer">
        <a href="https://portainer.patsiomkinhomelab.com" class="admin-btn">Admin Panel</a>
        <p class="credit">Built by N.Patsiomkin</p>
    </div>
</body>
</html>
